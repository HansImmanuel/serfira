# Demo profile (Addendum §18.4, T21a). The schema migrations always run; this profile adds
# the demo-only Flyway location so V99__demo_seed.sql inserts the three demo login users
# (admin / finance / manager, Addendum §18.3).
#
# The default and production profiles do not include db/demo, so they never seed those
# accounts. Flyway validates a database against the locations of the active profile: run
# demo databases with this profile from creation (docker compose default), and do not
# switch a demo database to prod without resetting it.
spring.flyway.locations=classpath:db/migration,classpath:db/demo

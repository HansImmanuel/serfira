spring.application.name=serfira-core
# Schema is owned by Flyway; Hibernate must never create/update tables (Database Rules).
spring.jpa.hibernate.ddl-auto=validate
# Wire naming convention (ADR-006): JSON fields are snake_case (contract_no, planned_start_date,
# total_elements, ...) to match docs/ and the frontend spec everywhere. Applies to DTOs only —
# Map keys are unaffected.
spring.jackson.property-naming-strategy=SNAKE_CASE
# Business timestamps are Asia/Jakarta (TS §2.0, injected Clock). The mapper must use the same zone: an
# idempotent response is re-parsed from `response_json` when it is replayed (TS §2.5), and Jackson
# re-expresses an OffsetDateTime in the mapper's zone — with the default UTC mapper a retry answered the
# same instant as `2026-09-21T00:00:00Z` where the original response had said `2026-09-21T00:00:00+07:00`.
spring.jackson.time-zone=Asia/Jakarta

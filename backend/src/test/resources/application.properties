# Mirrors src/main/resources/application.properties (this file shadows it on the test classpath) —
# keep these settings in sync so @SpringBootTest behaves identically to production.
spring.application.name=serfira-core
# Schema is owned by Flyway; Hibernate must never create/update tables (Database Rules).
spring.jpa.hibernate.ddl-auto=validate
# Mirrors src/main/resources/application.properties (ADR-006: snake_case wire naming).
spring.jackson.property-naming-strategy=SNAKE_CASE
# Mirrors src/main/resources/application.properties: business timestamps render in Asia/Jakarta so a
# replayed idempotent response is byte-identical to the original one (TS §2.0/§2.5).
spring.jackson.time-zone=Asia/Jakarta

# Test-only PII keys — 32-byte, base64-encoded. NEVER use these values outside automated tests.
serfira.security.pii.encryption-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
serfira.security.pii.hmac-key=YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODk=

# Test-only JWT signing key (base64 of 32 bytes) — must match the key minting test tokens.
serfira.security.jwt.secret-base64=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
# Fail fast on lazy loading outside a transaction instead of silently succeeding (Boot default is
# true). Every read maps its entity graph explicitly (EntityGraph / DTO projection), so an accidental
# lazy access must surface as an error instead of a hidden N+1 in production.
spring.jpa.open-in-view=false

# Scheduled work is invoked explicitly by tests; never let a background trigger race test fixtures.
serfira.jobs.daily-servicing.cron=-
serfira.jobs.daily-servicing.lock-at-most-for=PT1M
# Mirrors src/main/resources/application.properties (CR-08): keyset page size for daily servicing.
serfira.jobs.daily-servicing.batch-size=500
